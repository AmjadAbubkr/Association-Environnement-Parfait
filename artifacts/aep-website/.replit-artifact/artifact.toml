kind = "web"
previewPath = "/"
title = "Association Environnement Parfait"
description = "Site vitrine officiel de l'Association Environnement Parfait (AEP), une association tchadienne engagée pour la protection de l'environnement, la résilience climatique, la solidarité et l'action communautaire."
version = "1.0.0"
id = "artifacts/aep-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23888

[services.development]
run = "pnpm --filter @workspace/aep-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aep-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/aep-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23888"
BASE_PATH = "/"
